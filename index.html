<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Místico - Calendário de Criaturas</title>
  
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho Dinâmico: O JavaScript vai preencher o mês e o elemento aqui -->
    <header class="cabecalho-mistico">
        <h1 id="nome-mes">Carregando Mês...</h1>
        <p id="criatura-regente">Invocando criatura regente...</p>
    </header>

    <!-- 📅 O Calendário: Onde o usuário clica para abrir o portal -->
    <main class="container-calendario">
        <div class="instrucao">
            <p>Clique no dia de hoje para invocar o seu companheiro e receber um conselho...</p>
        </div>
        
        <!-- Botão místico que ativa o sorteio (No futuro talvez eu vá criar vários botões para cada dia do mês) -->
        <button class="botao-invocar">
            <span class="icone-magico">🔮</span> Revelar o Dia
        </button>
    </main>

    <!-- Janela Mágica (Modal estilo Carta de Tarô): Fica escondida até o clique -->
    <div id="janela-magica" class="modal-sobreposicao">
        <div class="carta-taro">
            <!-- Botão para fechar a janela -->
            <button class="botao-fechar" onclick="document.getElementById('janela-magica').classList.remove('mostrar')">×</button>
            
            <div class="conteudo-carta">
                <!-- Imagem do Pet Sorteado -->
                <img id="modal-pet-imagem" src="" alt="Criatura Sorteada" class="imagem-pet">
                
                <!-- Nome e Raridade do Pet -->
                <h2 id="modal-pet-nome">Nome do Pet</h2>
                
                <!-- O Poema Acolhedor -->
                <p id="modal-pet-poema">"O poema aparecerá aqui..."</p>
            </div>
        </div>
    </div>

    <!-- Link para o arquivo JavaScript-->
    <script type="module" src="script.js"></script>
</body>
</html>
